---
# vagrant-dev-sys configuration file.

# Make a copy of this file and name it "config.yml".
# Place config.yml in the same directory as your Vagrantfile.

# ==========
# Settings in the top level of the configuration file.

# Optional. Sequence of mappings.
# Each mapping in the sequence specifies a VM and its settings.
# virtual_machines:
# - hostname: "example-vm-1"
# - hostname: "example-vm-2"

# ==========
# Each mapping in the "virtual_machines" sequence can include the following:

# Optional. Boolean.
# Should the VM automatically start on a "vagrant up" with no VM explicitly specified?
# autostart: false  # Default: false

# Optional. String.
# The provider for the VM.
# provider: "virtualbox"  # Default: "virtualbox"

# Optional. Mapping.
# A mapping of the ansible-dev-sys settings.
# Used to adjust the provisioning of ansible-dev-sys.
# ansible_dev_sys:

# Optional. Mapping.
# A mapping of the bash-environment settings.
# Used to adjust the provisioning of bash-environment.
# bash_environment:

# Maybe required. Mapping.
# Only required if the VM uses the "digitalocean" provider.
# A mapping of the DigitalOcean settings.
# digitalocean:

# Required. String.
# The hostname of the VM.
# hostname: "example-vm-1"

# Optional. Mapping.
# A mapping of the directories and files to be copied to the VM during provisioning.
# provision:

# Optional. Sequence of mappings.
# Each mapping in the sequence specifies a directory to be synced during provisioning and upon command.
# "host" and "remote" are required.
# synced_directories:
# - host: "C:/full/path/to/the/dir/to/sync/on/the/host"
#   remote: "/full/path/to/the/destination/dirname/on/the/vm"

# Optional. Mapping.
# A mapping of the VirtualBox settings.
# virtualbox:

# ==========
# Settings in the "ansible-dev-sys" mapping in "virtual_machines".

# Optional. String.
# A directory on the VM that will already contain the ansible-dev-sys workspace.
# The ansible-dev-sys repository will not be cloned from git.
# This can occur if the workspace is synced from the host to the VM in the "synced-directories" sequence.
# This is used for ansible-dev-sys development.
# This setting overrides the "version" setting.
# dir: "/full/path/to/the/ansible-dev-sys/dir/on/the/vm"

# Optional. Sequence of strings.
# This sequence specifies the tags to pass to Ansible.
# tags:
# - "always"  # Default: "always"

# Optional. String.
# The version of ansible-dev-sys to clone and use.
# Do not specify unless you want a specific branch of ansible-dev-sys.
# This is used for ansible-dev-sys development.
# This setting is overridden by the "dir" setting.
# version: "1.2.3"

# ==========
# Settings in the "bash-environment" mapping in "virtual_machines".

# Optional.
# A directory on the VM that will already contain the bash-environment workspace.
# The bash-environment repository will not be cloned from git.
# This can occur if the workspace is synced from the host to the VM in the "synced-directories" sequence.
# This is used for bash-environment development.
# This setting overrides the "version" setting.
# dir: "/full/path/to/the/bash-environment/dir/on/the/vm"

# Optional. String.
# The version of bash-environment to clone and use.
# Do not specify unless you want a specific branch of bash-environment.
# This is used for bash-environment development.
# This setting is overridden by the "dir" setting.
# version: "1.2.3"

# ==========
# Settings in the "digitalocean" mapping in "virtual_machines".

# Required. String.
# The DigitalOcean API token to use.
# api_token: "12345"

# Required. String.
# The SSH private key used by Vagrant to access the VM (Droplet).
# private_key_file: "C:/full/path/to/the/host/ssh/private/key/file"

# Required. String.
# The name of the SSH public key on DigitalOcean to be used by Vagrant to access the VM (Droplet).
# It is assumed that this matching public key has already been uploaded to DigitalOcean.
# ssh_key_name: "digitalocean-key-name"

# Optional. Strings.
# The VM (Droplet) parameters.
# Note: If you change or override any of the following parameters, make sure that the combination of "image" and "size"
# is valid for the specified "region". Not all regions support all combinations of "image" and "size".
# image: "ubuntu-26-04-x64"  # Default: "ubuntu-26-04-x64"
# region: "nyc2"  # Default: "nyc2"
# size: "s-2vcpu-4gb"  # Default: "s-2vcpu-4gb"

# ==========
# Settings in the "provision" mapping in "virtual_machines".

# Optional. Sequence of mappings.
# Each mapping in the sequence specifies a directory to be copied.
# "host" and "remote" are required. "dir_mode" and "file_mode" are optional.
# dirs:
# - host: "C:/full/path/to/the/dir/to/copy/on/the/host"
#   remote: "/full/path/to/the/destination/dirname/on/the/vm"
#   dir_mode: "chmod-mode-for-all-the-dirs-in-the-vm-destination"
#   file_mode: "chmod-mode-for-all-the-files-in-the-vm-destination"

# Optional. Sequence of mappings.
# Each mapping in the sequence specifies a file to be copied.
# "host" and "remote" are required. "file_mode" is optional.
# files:
# - host: "C:/full/path/to/the/file/to/copy/on/the/host"
#   remote: "/full/path/to/the/destination/filename/on/the/vm"
#   file_mode: "chmod-mode-for-the-file-at-the-vm-destination"

# ==========
# Settings in the "virtualbox" mapping in "virtual_machines".

# Optional. String.
# The name of the VirtualBox box to use for the VM.
# box: "bento/ubuntu-26.04"  # Default: "bento/ubuntu-26.04"

# Optional. String.
# The size of the VM's disk.
# If "disk_size" is "default", the VM's disk will not be resized.
# If "disk_size" is not "default", then it must be a number followed by "GB", such as "40GB".
# disk_size: "default"  # Default: "default"

# Optional. Boolean.
# Should the host display the VM's console?
# gui: false  # Default: false

# Optional. Integer.
# The amount of memory to allocate to the VM in megabytes.
# memory: 4096  # Default: 4096

# Optional.
# A mapping of the host and VM network settings.
# network:

# Optional. Boolean.
# Should the VirtualBox guest additions on the VM be updated if out of date?
# update_guest_additions: false  # Default: false

# ==========
# Settings in the "network" mapping in "virtualbox".

# Optional. Sequence of mappings.
# Each mapping in the sequence specifies the ports to forward to/from the host and the VM.
# "host" and "remote" are required. "auto_correct" and "protocol" are optional.
# forwarded_ports:
# - auto_correct: false  # Default: false
#   host: 8000
#   remote: 80
#   protocol: "tcp"  #Default: "tcp"

# Optional. Mapping.
# Specifies that the VM is on a private network with the host, and cannot be accessed by the host's WAN.
# This option overrides "public_network".
# private_network:

# Optional. Mapping.
# Specifies that the VM is bridged (on a public network) with the host, and can be accessed by the host's WAN.
# This option is overridden by the "private_network" setting.
# public_network:

# Optional. Mapping.
# Specifies the range of port numbers to use for port forwarding, if a port collision occurs.
# usable_port_range:

# ==========
# Settings in the "private_network" mapping in "network".

# Required. String.
# Specifies the IP address of the VM on the private network.
# "ip" can either be "dhcp", or a static IPv4 or IPv6 address.
# ip: "dhcp"  # Default: "dhcp"

# ==========
# Settings in the "public_network" mapping in "network".

# Required. String.
# Specifies the IP address of the VM on the public network.
# "ip" can either be "dhcp", or a static IPv4 or IPv6 address.
# ip: "dhcp"  # Default: "dhcp"

# Optional. Sequence of strings.
# A sequence of possible host interfaces to use as the bridge.
# Entries in the list are in priority order. The first interface to be present will be used.
# interfaces:
# - "Killer(R) Wi-Fi 6E AX1675x 160MHz Wireless Network Adapter (210NGW)"
# - "Killer E3100G 2.5 Gigabit Ethernet Controller"

# ==========
# Settings in the "usable_port_range" mapping in "network".

# Required. Integer.
# The start (inclusive) of the usable port range.
# start: 8000

# Required. Integer.
# The end (inclusive) of the usable port range.
# stop: 8999

# ==========
